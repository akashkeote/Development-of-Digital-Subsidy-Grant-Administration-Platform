spring.application.name=backend

# ============================================================
# ENTERPRISE ARCHITECTURE:
#   SCHEMES   → Local JSON (in-memory) — zero quota, instant
#   APPLICATIONS → Supabase PostgreSQL (persistent)
#   REAL-TIME    → Firebase Firestore (Flutter live updates)
# ============================================================

# Server
server.port=8080

# ===== Supabase PostgreSQL (Applications ONLY — NOT schemes) =====
# Transaction pooler — port 5432
spring.datasource.url=jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.zeptrxleipweahpgujqr
spring.datasource.password=jd96SxHPFti4qZkA
spring.datasource.driver-class-name=org.postgresql.Driver
# Lazy connection — don't crash startup if Supabase is unreachable
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.minimum-idle=0

# JPA — manages 'applications' table only
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# none = don't run DDL on startup (prevents crash if DB is down)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Disable JPA auto-config for Subsidy (schemes are local JSON, not JPA entities)
spring.autoconfigure.exclude=
