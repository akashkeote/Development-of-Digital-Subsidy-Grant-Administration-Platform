spring.datasource.url=jdbc:mysql://localhost:3306/govt_grants_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=govt_user
spring.datasource.password=Govt@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

